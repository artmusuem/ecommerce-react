name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Required for Shopify API in tests (public storefront token - read-only)
  VITE_SHOPIFY_STORE: ${{ secrets.VITE_SHOPIFY_STORE }}
  VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_TOKEN }}
  VITE_DATA_SOURCE: ${{ secrets.VITE_DATA_SOURCE }}
  VITE_CLOUDINARY_CLOUD: ${{ secrets.VITE_CLOUDINARY_CLOUD }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          # Extract coverage percentages from JSON report
          COVERAGE=$(cat coverage/coverage-summary.json)
          LINES=$(echo $COVERAGE | jq -r '.total.lines.pct')
          FUNCTIONS=$(echo $COVERAGE | jq -r '.total.functions.pct')
          BRANCHES=$(echo $COVERAGE | jq -r '.total.branches.pct')
          STATEMENTS=$(echo $COVERAGE | jq -r '.total.statements.pct')

          echo "Coverage Report:"
          echo "  Lines: $LINES%"
          echo "  Functions: $FUNCTIONS%"
          echo "  Branches: $BRANCHES%"
          echo "  Statements: $STATEMENTS%"

          # Check thresholds (fail if below)
          if (( $(echo "$LINES < 70" | bc -l) )); then
            echo "::error::Line coverage ($LINES%) is below threshold (70%)"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build
          path: build/
          retention-days: 1

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: build/

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
